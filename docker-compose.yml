services:
  app:
    build: .
    image: mesh-creator:latest
    restart: unless-stopped
    environment:
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-500}
    volumes:
      # On the host so cleanup-uploads.sh can run from cron
      - ./uploads:/app/uploads
    expose:
      - "3000"

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:-:80}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-500}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
